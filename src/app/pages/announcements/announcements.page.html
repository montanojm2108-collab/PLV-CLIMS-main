<app-page-header title="Announcements">
</app-page-header>
<ion-content>
<main class="page-wrap">
<h1 class="page-title">Announcements</h1>
<p class="page-subtitle">Latest laboratory notices and service updates.</p>
<section class="panel">
<div class="toolbar-row">
<h2>All announcements</h2>
<button class="btn secondary" (click)="markAll()">Mark all as read</button>
</div>
<input class="field" [(ngModel)]="query" placeholder="Search announcements...">
<div class="record-list" style="margin-top:15px">
<div class="record" *ngFor="let a of items">
<div class="details">
<strong>{{a.title}}</strong>
<small>{{a.category}} · {{a.date | date:'mediumDate'}} · {{read(a.id)?'Read':'Unread'}}</small>
</div>
<button class="btn btn-sm" (click)="open(a.id)">View details</button>
</div>
<p class="empty" *ngIf="!items.length">No announcements found.</p>
</div>
</section>
</main>
</ion-content>
